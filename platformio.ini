; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
;   pio run -e uno                 build the firmware
;   pio run -e uno -t upload       flash it
;   pio device monitor             serial log (115200 baud)
;   pio test -e native             host unit tests (needs gcc/g++ on PATH)

[platformio]
default_envs = uno

[env]
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
; Warnings for project sources only (not the Arduino core / libraries).
build_src_flags = -Wall -Wextra

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps = teckel12/NewPing@^1.9.7
; Switch lookup tables would be placed in RAM (.data) on the AVR.
build_src_flags = ${env.build_src_flags} -fno-tree-switch-conversion
; Log level: 0 none, 1 error, 2 info (default), 3 debug (calibration).
; build_flags = ${env.build_flags} -D MM_LOG_LEVEL=3
; The unit tests are host-only (see env:native).
test_ignore = *

[env:native]
platform = native
test_framework = unity
; Build the Arduino-independent modules from src/ into the tests.
test_build_src = yes
build_src_filter =
    -<*>
    +<control/pid.cc>
    +<control/motion_profile.cc>
    +<control/wheel_mixer.cc>
    +<control/wall_centering.cc>
    +<navigation/*.cc>
build_flags = ${env.build_flags} -I src
