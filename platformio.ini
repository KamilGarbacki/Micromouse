; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
;   pio run -e uno                 build the firmware
;   pio run -e uno -t upload       flash it
;   pio device monitor             serial log (115200 baud)
;   pio test -e native             host unit tests (needs gcc/g++ on PATH)

[platformio]
default_envs = uno

[env]
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
; Warnings for project sources only (not the Arduino core / libraries).
build_src_flags = -Wall -Wextra

[env:uno]
; COMPETITION firmware: no startup menu, learning + front alignment on,
; log level 2. Loads the calibration stored by uno_setup from EEPROM.
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps = teckel12/NewPing@^1.9.7
; Switch lookup tables would be placed in RAM (.data) on the AVR.
build_src_flags = ${env.build_src_flags} -fno-tree-switch-conversion
; Size: shared prologue/epilogue routines (-mcall-prologues), linker
; relaxation (-Wl,--relax) and no inlining of small functions. Measured
; together about -1 KB; -fno-inline-small-functions alone: -218 B (uno),
; -82 B (uno_debug), +404 B (uno_setup, which has room). It costs a call
; (a few us) per small function, far below the 10 ms control period.
build_flags = ${env.build_flags} -mcall-prologues -Wl,--relax
    -fno-inline-small-functions
; Log level: 0 none, 1 error, 2 info (default), 3 debug (calibration).
; Features: -D MM_WALL_CENTERING=1, -D MM_FRONT_ALIGN=0, -D MM_LEARNING=0.
; The unit tests are host-only (see env:native).
test_ignore = *

[env:uno_setup]
; BENCH firmware: startup menu ('e' encoder check, 'c' motor
; self-calibration, 'r' reset, 'p' print the learned values) and debug log.
; Bench tools only: no online learning (it would not fit next to the menu).
; Same EEPROM layout as uno: flash this first, calibrate, then flash uno.
extends = env:uno
build_flags = ${env:uno.build_flags} -D MM_MENU=1 -D MM_LOG_LEVEL=3
    -D MM_LEARNING=0

[env:uno_debug]
; Competition firmware with the debug log: live learning progress
; ("learn ..." lines), move diagnostics and the maze after every plan.
; FLASH: ~1.27 KB free; with -D MM_WALL_CENTERING=1 only ~166 B free
; (32090 of 32256 B) - that combination cannot take any additions.
extends = env:uno
build_flags = ${env:uno.build_flags} -D MM_LOG_LEVEL=3

[env:native]
platform = native
test_framework = unity
; Build the Arduino-independent modules from src/ into the tests.
test_build_src = yes
build_src_filter =
    -<*>
    +<control/pid.cc>
    +<control/motion_profile.cc>
    +<control/wheel_mixer.cc>
    +<control/wall_centering.cc>
    +<control/calibration.cc>
    +<control/ff_fit.cc>
    +<control/learning.cc>
    +<app/online_learning.cc>
    +<navigation/*.cc>
build_flags = ${env.build_flags} -I src

[env:sim]
; Host simulator / visualiser (see README "Simulator / visualisation"): no
; hardware, no motor physics. Links the REAL pure navigation code
; (Explorer/Maze/FloodFill/maze_render, the same config as the firmware)
; with tools/sim/*.cc into a native executable; it does not duplicate any
; decision logic. Build once, then run the program directly with its own
; CLI flags:
;   pio run -e sim
;   .pio/build/sim/program tools/sim/mazes/config_maze.txt
platform = native
build_src_filter =
    -<*>
    +<navigation/*.cc>
    +<../tools/sim/*.cc>
build_flags = ${env.build_flags} -I src -I tools/sim
test_ignore = *
